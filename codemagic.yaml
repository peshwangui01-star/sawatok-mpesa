workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 20
    environment:
      flutter: stable
    scripts:
      - name: Create android folder
        script: |
          flutter create . --platforms=android
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK debug
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
